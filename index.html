<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 可驗證開發工作台｜輪胎批發 ERP 試做</title>
  <link rel="stylesheet" href="css/style.css?v=2026-10-14.12">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">AI 開發工作台</div>
      <nav id="nav" class="nav" aria-label="工作步驟"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <div class="frame">
      <header class="topbar">
        <div class="crumb" id="crumb"></div>
        <div class="top-actions">
          <span class="pill ver" id="verBadge"></span>
          <button type="button" class="btn sm ghost" data-act="toggle-demo">示範導覽（8 分鐘）</button>
          <button type="button" class="btn sm ghost danger" data-act="reset">重設資料</button>
        </div>
      </header>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <aside id="demo" class="demo" hidden></aside>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal" class="modal-wrap" hidden></div>

  <!-- 載入順序：data → store → rules → erp → tests → app（不使用 ES modules） -->
  <script src="js/data.js?v=2026-10-14.12"></script>
  <script src="js/store.js?v=2026-10-14.12"></script>
  <script src="js/rules.js?v=2026-10-14.12"></script>
  <script src="js/erp.js?v=2026-10-14.12"></script>
  <script src="js/tests.js?v=2026-10-14.12"></script>
  <script src="js/app.js?v=2026-10-14.12"></script>
</body>
</html>
